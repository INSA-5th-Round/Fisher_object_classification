<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FISHER AI CCTV Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: #e5e7eb;
            padding: 25px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 28px;
        }

        .status {
            background: #064e3b;
            color: #6ee7b7;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: bold;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
        }

        .card h3 {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card .value {
            font-size: 28px;
            font-weight: bold;
        }

        .section {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
        }

        .section h2 {
            margin-bottom: 20px;
        }

        .alert {
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
            background: #0f172a;
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .event {
            font-size: 20px;
            font-weight: bold;
        }

        .severity {
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .critical {
            background: #7f1d1d;
            color: #fecaca;
        }

        .high {
            background: #78350f;
            color: #fed7aa;
        }

        .normal {
            background: #064e3b;
            color: #a7f3d0;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .detail {
            background: #1f2937;
            padding: 12px;
            border-radius: 8px;
        }

        .detail span {
            display: block;
            color: #9ca3af;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .screenshot {
            margin-top: 15px;
        }

        .screenshot img {
            width: 100%;
            max-width: 600px;
            max-height: 350px;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid #374151;
        }

        .notifications {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .notification {
            padding: 7px 12px;
            border-radius: 15px;
            background: #1f2937;
            font-size: 13px;
        }

        .sent {
            color: #6ee7b7;
        }

        .failed {
            color: #fca5a5;
        }

        .empty {
            text-align: center;
            color: #9ca3af;
            padding: 40px;
        }

        .refresh {
            margin-top: 20px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .refresh:hover {
            background: #1d4ed8;
        }

        @media (max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .details {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <div>
        <h1>🚨 FISHER AI CCTV</h1>
        <p>Security Alert Dashboard</p>
    </div>

    <div class="status">
        ● SYSTEM ONLINE
    </div>
</div>


<div class="cards">

    <div class="card">
        <h3>TOTAL ALERTS</h3>
        <div class="value" id="totalAlerts">0</div>
    </div>

    <div class="card">
        <h3>CRITICAL</h3>
        <div class="value" id="criticalAlerts">0</div>
    </div>

    <div class="card">
        <h3>HIGH</h3>
        <div class="value" id="highAlerts">0</div>
    </div>

    <div class="card">
        <h3>LAST ALERT</h3>
        <div class="value" id="lastAlert">--</div>
    </div>

</div>


<div class="section">

    <h2>Alert History</h2>

    <div id="alerts">
        <div class="empty">
            Loading alerts...
        </div>
    </div>

    <button class="refresh" onclick="loadAlerts()">
        🔄 Refresh Alerts
    </button>

</div>


<script>

async function loadAlerts() {

    try {

        const response = await fetch("/alerts");

        const data = await response.json();

        const alertsContainer =
            document.getElementById("alerts");

        const alerts = data.alerts || [];

        document.getElementById("totalAlerts").textContent =
            alerts.length;

        const critical =
            alerts.filter(a =>
                a.event?.severity === "CRITICAL"
            ).length;

        const high =
            alerts.filter(a =>
                a.event?.severity === "HIGH"
            ).length;

        document.getElementById("criticalAlerts").textContent =
            critical;

        document.getElementById("highAlerts").textContent =
            high;

        if (alerts.length === 0) {

            alertsContainer.innerHTML =
                '<div class="empty">No alerts found.</div>';

            return;
        }

        const latest =
            alerts[0]?.event?.event_type || "--";

        document.getElementById("lastAlert").textContent =
            latest;

        alertsContainer.innerHTML = "";

        alerts.forEach(alert => {

            const event = alert.event || {};

            const severity =
                (event.severity || "HIGH").toUpperCase();

            let severityClass = "normal";

            if (severity === "CRITICAL") {
                severityClass = "critical";
            } else if (severity === "HIGH") {
                severityClass = "high";
            }

            const channelResults =
                alert.channel_results || [];

            let notifications = "";

            channelResults.forEach(channel => {

                const channelName =
                    channel.channel || "notification";

                const sent =
                    channel.sent === true;

                notifications += `
                    <div class="notification ${sent ? "sent" : "failed"}">
                        ${sent ? "✓" : "✗"}
                        ${channelName.toUpperCase()}
                    </div>
                `;
            });

            let screenshot = "";

            if (alert.saved_screenshot) {

                const filename =
                    alert.saved_screenshot.split("/").pop();

                screenshot = `
                    <div class="screenshot">
                        <strong>📷 Detection Screenshot</strong>
                        <br><br>
                        <img
                            src="/screenshots/${filename}"
                            alt="Detection screenshot"
                        >
                    </div>
                `;
            }

            const alertHTML = `

                <div class="alert">

                    <div class="alert-header">

                        <div class="event">
                            🚨 ${event.event_type || "Unknown Event"}
                        </div>

                        <div class="severity ${severityClass}">
                            ${severity}
                        </div>

                    </div>

                    <div class="details">

                        <div class="detail">
                            <span>CAMERA</span>
                            ${event.camera || "--"}
                        </div>

                        <div class="detail">
                            <span>CONFIDENCE</span>
                            ${event.confidence ?? "--"}
                        </div>

                        <div class="detail">
                            <span>TIME</span>
                            ${event.timestamp || alert.logged_at || "--"}
                        </div>

                        <div class="detail">
                            <span>STATUS</span>
                            ${alert.status || "--"}
                        </div>

                    </div>

                    <div>
                        <strong>Message:</strong>
                        ${event.message || "No message"}
                    </div>

                    <div class="notifications">
                        ${notifications}
                    </div>

                    ${screenshot}

                </div>
            `;

            alertsContainer.innerHTML += alertHTML;

        });

    } catch (error) {

        console.error(error);

        document.getElementById("alerts").innerHTML =
            '<div class="empty">Unable to connect to Alert API.</div>';
    }
}


loadAlerts();

setInterval(loadAlerts, 10000);

</script>

</body>
</html>
